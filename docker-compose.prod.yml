services:
  # 1. PostgreSQL Database with pgvector (Private Network Only)
  db:
    image: pgvector/pgvector:pg15
    container_name: self_study_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-self_study_os}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - self_study_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024M

  # 2. FastAPI Backend API (Gunicorn + Uvicorn Workers, Private Network Only)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: self_study_backend_prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-self_study_os}
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-default_insecure_secret_must_change_in_production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,https://localhost}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      CONSENSUS_API_KEY: ${CONSENSUS_API_KEY:-}
    networks:
      - self_study_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024M

  # 3. Next.js Frontend (Standalone SSR, Private Network Only)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8000/api/v1
    container_name: self_study_frontend_prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8000/api/v1
    networks:
      - self_study_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024M

  # 4. Nginx Ingress Gateway & Reverse Proxy (Public Facing)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: self_study_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - self_study_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health-nginx"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 5. Certbot Automated SSL Renewal
  certbot:
    image: certbot/certbot:latest
    container_name: self_study_certbot_prod
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - self_study_network

networks:
  self_study_network:
    driver: bridge

volumes:
  postgres_data_prod:
  certbot_conf:
  certbot_www:
